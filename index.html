<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓国語助詞マスター - 3Dフラッシュカード</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', '"Noto Sans KR"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 3D Card Flip Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 transition-all">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid font-bold text-xl">韓</i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-800">韓国語助詞マスター</h1>
                    <p class="text-xs text-slate-500">ハングル助詞完全攻略フラッシュカード</p>
                </div>
            </div>

            <!-- View Switcher & Actions -->
            <div class="flex items-center gap-2">
                <button id="btnShuffle" title="シャッフル" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 transition">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <div class="bg-slate-100 p-1 rounded-xl flex gap-1">
                    <button id="tabCardView" class="px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm bg-white text-blue-600 flex items-center gap-1.5">
                        <i class="fa-solid fa-clone"></i> <span class="hidden sm:inline">カード</span>
                    </button>
                    <button id="tabGridView" class="px-3 py-1.5 rounded-lg text-sm font-medium transition text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
                        <i class="fa-solid fa-border-all"></i> <span class="hidden sm:inline">一覧</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 flex flex-col gap-6">

        <!-- Progress & Search Toolbar -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col md:flex-row gap-4 justify-between items-center">
            
            <!-- Progress Bar -->
            <div class="w-full md:w-1/3 flex flex-col gap-1.5">
                <div class="flex justify-between text-xs font-semibold">
                    <span class="text-slate-500">学習進捗</span>
                    <span id="progressText" class="text-blue-600">0 / 0 (0%)</span>
                </div>
                <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden border border-slate-200/60">
                    <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-600 w-0 transition-all duration-500"></div>
                </div>
            </div>

            <!-- Filters & Search -->
            <div class="w-full md:w-auto flex flex-wrap sm:flex-nowrap gap-2 items-center">
                <!-- Search Input -->
                <div class="relative flex-1 sm:w-48">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="検索 (日本語, 韓, 読み)" class="w-full pl-8 pr-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                </div>

                <!-- Category Filter -->
                <select id="categoryFilter" class="px-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700">
                    <option value="ALL">すべてのカテゴリ</option>
                    <option value="基本の助詞">① 基本の助詞</option>
                    <option value="場所・時間・方向">② 場所・時間・方向</option>
                    <option value="限定・比較・強調">③ 限定・比較・強調</option>
                    <option value="その他の便利な助詞">④ その他の便利な助詞</option>
                </select>

                <!-- Status Filter -->
                <select id="statusFilter" class="px-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700">
                    <option value="ALL">すべてのカード</option>
                    <option value="UNSTARRED">未習得のみ</option>
                    <option value="STARRED">習得済みのみ★</option>
                </select>
            </div>
        </section>

        <!-- CARD VIEW -->
        <section id="cardViewContainer" class="flex-1 flex flex-col items-center justify-center min-h-[420px] relative">
            
            <!-- Cards Counter Badge -->
            <div class="mb-3 text-xs font-semibold text-slate-500 bg-slate-200/60 px-3 py-1 rounded-full">
                <span id="currentCardNum">0</span> / <span id="totalCardsNum">0</span>
            </div>

            <!-- 3D Card Area -->
            <div class="w-full max-w-md h-[360px] sm:h-[400px] perspective-1000 relative">
                <div id="flashcard" class="w-full h-full transform-style-3d transition-transform duration-500 cursor-pointer relative rounded-3xl shadow-xl hover:shadow-2xl">
                    
                    <!-- Card Front (Japanese) -->
                    <div class="absolute inset-0 backface-hidden bg-gradient-to-br from-white via-slate-50 to-blue-50/50 border border-slate-200/80 rounded-3xl p-6 flex flex-col justify-between select-none">
                        <div class="flex justify-between items-center">
                            <span id="cardCategoryFront" class="text-xs font-semibold text-blue-600 bg-blue-100/80 px-2.5 py-1 rounded-lg">基本の助詞</span>
                            <button class="star-btn p-2 text-slate-300 hover:text-amber-400 text-xl transition" title="習得マーク">
                                <i class="fa-solid fa-star"></i>
                            </button>
                        </div>

                        <div class="text-center my-auto px-2">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">日本語</p>
                            <h2 id="cardJapanese" class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight leading-snug">は</h2>
                        </div>

                        <div class="text-center text-slate-400 text-xs flex items-center justify-center gap-1">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>タップして裏面を表示</span>
                        </div>
                    </div>

                    <!-- Card Back (Korean) -->
                    <div class="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-white rounded-3xl p-6 flex flex-col justify-between border border-slate-700/50 shadow-2xl select-none">
                        <div class="flex justify-between items-center">
                            <span id="cardCategoryBack" class="text-xs font-semibold text-blue-300 bg-blue-950/80 border border-blue-800/50 px-2.5 py-1 rounded-lg">基本の助詞</span>
                            <div class="flex items-center gap-1">
                                <button id="btnTTSParticle" class="p-2 text-blue-400 hover:text-white text-lg transition" title="助詞の発音を聞く">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                                <button class="star-btn p-2 text-slate-500 hover:text-amber-400 text-xl transition" title="習得マーク">
                                    <i class="fa-solid fa-star"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Main Particle Output -->
                        <div class="text-center my-auto">
                            <h2 id="cardKorean" class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-indigo-200 to-pink-300 mb-2 tracking-wide font-sans">은 / 는</h2>
                            <p id="cardReading" class="text-base sm:text-lg text-slate-300 font-medium">ウン / ヌン</p>
                        </div>

                        <!-- Example Box -->
                        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3 sm:p-4 border border-white/10 flex items-start gap-3">
                            <button id="btnTTSExample" class="mt-0.5 text-blue-300 hover:text-white transition flex-shrink-0" title="例文を聞く">
                                <i class="fa-solid fa-volume-high text-base"></i>
                            </button>
                            <div class="text-left overflow-hidden">
                                <p id="cardExampleKr" class="text-sm font-semibold text-blue-100 truncate sm:whitespace-normal">저는 학생입니다.</p>
                                <p id="cardExampleJa" class="text-xs text-slate-300 mt-0.5 truncate sm:whitespace-normal">私は学生です。</p>
                            </div>
                        </div>

                        <div class="text-center text-slate-500 text-xs flex items-center justify-center gap-1 mt-1">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>タップして表面に戻る</span>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Card Controls -->
            <div class="flex items-center gap-4 mt-6">
                <button id="btnPrev" class="w-12 h-12 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200/80 shadow-md flex items-center justify-center text-slate-700 active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-chevron-left text-lg"></i>
                </button>

                <button id="btnFlip" class="px-6 py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-semibold shadow-lg shadow-blue-500/30 active:scale-95 transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i>
                    <span>めくる</span>
                </button>

                <button id="btnNext" class="w-12 h-12 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200/80 shadow-md flex items-center justify-center text-slate-700 active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-chevron-right text-lg"></i>
                </button>
            </div>

            <!-- Empty State for Card View -->
            <div id="cardEmptyState" class="hidden absolute inset-0 bg-slate-100/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center text-center p-6 rounded-3xl">
                <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                <h3 class="text-lg font-bold text-slate-700 mb-1">カードが見つかりません</h3>
                <p class="text-xs text-slate-500 mb-4">検索条件またはフィルターを変更してください。</p>
                <button id="btnResetFilters" class="px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-xl shadow hover:bg-blue-700 transition">
                    フィルターをリセット
                </button>
            </div>
        </section>

        <!-- GRID VIEW -->
        <section id="gridViewContainer" class="hidden flex-1">
            <div id="gridCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Grid items generated dynamically -->
            </div>

            <!-- Empty State for Grid View -->
            <div id="gridEmptyState" class="hidden py-16 text-center">
                <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                <h3 class="text-lg font-bold text-slate-700 mb-1">カードが見つかりません</h3>
                <p class="text-xs text-slate-500">検索語句やフィルター条件を見直してください。</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 mt-auto">
        <p>韓国語助詞マスター - 3D Flashcards App</p>
    </footer>

        const categoryFilter = document.getElementById('categoryFilter');
        const statusFilter = document.getElementById('statusFilter');

        const tabCardView = document.getElementById('tabCardView');
        const tabGridView = document.getElementById('tabGridView');
        const cardViewContainer = document.getElementById('cardViewContainer');
        const gridViewContainer = document.getElementById('gridViewContainer');
        const gridCards = document.getElementById('gridCards');
        const cardEmptyState = document.getElementById('cardEmptyState');
        const gridEmptyState = document.getElementById('gridEmptyState');
        const btnResetFilters = document.getElementById('btnResetFilters');

        // Speech Synthesis Setup
        const synth = window.speechSynthesis;

        function speakKorean(text) {
            if (!synth) {
                alert("お使いのブラウザは音声読み上げに対応していません。");
                return;
            }
            synth.cancel(); // Stop current speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.85; // Slightly slower for clear learning
            synth.speak(utterance);
        }

        // Save starred state
        function saveStarred() {
            localStorage.setItem('korean_starred_ids', JSON.stringify([...starredIds]));
            updateProgress();
        }

        // Update overall progress bar
        function updateProgress() {
            const total = PARTICLES_DATA.length;
            const learned = starredIds.size;
            const percentage = Math.round((learned / total) * 100);
            progressText.textContent = `${learned} / ${total} (${percentage}%)`;
            progressBar.style.width = `${percentage}%`;
        }

        // Filter cards based on search & selectors
        function filterCards() {
            const query = searchInput.value.trim().toLowerCase();
            const cat = categoryFilter.value;
            const status = statusFilter.value;

            filteredCards = PARTICLES_DATA.filter(card => {
                // Category Filter
                if (cat !== 'ALL' && card.category !== cat) return false;

                // Status Filter
                const isStarred = starredIds.has(card.id);
                if (status === 'STARRED' && !isStarred) return false;
                if (status === 'UNSTARRED' && isStarred) return false;

                // Text Search Query
                if (query) {
                    const matchJa = card.ja.toLowerCase().includes(query);
                    const matchKr = card.kr.toLowerCase().includes(query);
                    const matchReading = card.reading.toLowerCase().includes(query);
                    const matchExKr = card.exKr.toLowerCase().includes(query);
                    const matchExJa = card.exJa.toLowerCase().includes(query);
                    return matchJa || matchKr || matchReading || matchExKr || matchExJa;
                }

                return true;
            });

            currentIndex = 0;
            isFlipped = false;
            updateCardDisplay();
            renderGrid();
        }

        // Update Flashcard UI
        function updateCardDisplay() {
            if (filteredCards.length === 0) {
                cardEmptyState.classList.remove('hidden');
                currentCardNum.textContent = '0';
                totalCardsNum.textContent = '0';
                return;
            }

            cardEmptyState.classList.add('hidden');
            const card = filteredCards[currentIndex];

            // Unflip card without animation glitch when changing content
            if (isFlipped) {
                flashcard.classList.remove('rotate-y-180');
                isFlipped = false;
            }

            setTimeout(() => {
                cardCategoryFront.textContent = card.category;
                cardCategoryBack.textContent = card.category;
                cardJapanese.textContent = card.ja;
                cardKorean.textContent = card.kr;
                cardReading.textContent = card.reading;
                cardExampleKr.textContent = card.exKr;
                cardExampleJa.textContent = card.exJa;

                // Update Star Icons
                document.querySelectorAll('#flashcard .star-btn').forEach(btn => {
                    if (starredIds.has(card.id)) {
                        btn.classList.add('text-amber-400');
                        btn.classList.remove('text-slate-300', 'text-slate-500');
                    } else {
                        btn.classList.remove('text-amber-400');
                        btn.classList.add(btn.closest('.rotate-y-180') ? 'text-slate-500' : 'text-slate-300');
                    }
                });

                currentCardNum.textContent = (currentIndex + 1).toString();
                totalCardsNum.textContent = filteredCards.length.toString();

                btnPrev.disabled = currentIndex === 0;
                btnNext.disabled = currentIndex === filteredCards.length - 1;
            }, isFlipped ? 200 : 0);
        }

        // Toggle Flip State
        function toggleFlip() {
            if (filteredCards.length === 0) return;
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcard.classList.add('rotate-y-180');
            } else {
                flashcard.classList.remove('rotate-y-180');
            }
        }

        // Toggle Starred Item
        function toggleStar(cardId) {
            if (starredIds.has(cardId)) {
                starredIds.delete(cardId);
            } else {
                starredIds.add(cardId);
            }
            saveStarred();
            
            if (currentMode === 'card') {
                updateCardDisplay();
                if (statusFilter.value !== 'ALL') filterCards();
            } else {
                renderGrid();
            }
        }

        // Render Grid View
        function renderGrid() {
            gridCards.innerHTML = '';
            if (filteredCards.length === 0) {
                gridEmptyState.classList.remove('hidden');
                return;
            }
            gridEmptyState.classList.add('hidden');

            filteredCards.forEach(card => {
                const isStarred = starredIds.has(card.id);
                const cardEl = document.createElement('div');
                cardEl.className = 'bg-white border border-slate-200/80 rounded-2xl p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between gap-3 relative';
                
                cardEl.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">${card.category}</span>
                        <button class="grid-star-btn p-1 ${isStarred ? 'text-amber-400' : 'text-slate-300 hover:text-amber-400'} text-lg transition" data-id="${card.id}">
                            <i class="fa-solid fa-star"></i>
                        </button>
                    </div>

                    <div class="flex items-baseline justify-between border-b border-slate-100 pb-2">
                        <div>
                            <span class="text-xs text-slate-400 block">日本語</span>
                            <span class="text-lg font-bold text-slate-800">${card.ja}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-slate-400 block">${card.reading}</span>
                            <span class="text-xl font-black text-blue-600">${card.kr}</span>
                        </div>
                    </div>

                    <div class="bg-slate-50 rounded-xl p-2.5 flex items-start justify-between gap-2">
                        <div class="text-xs">
                            <p class="font-bold text-slate-700">${card.exKr}</p>
                            <p class="text-slate-500 mt-0.5">${card.exJa}</p>
                        </div>
                        <button class="grid-tts-btn text-blue-500 hover:text-blue-700 p-1" data-kr="${card.exKr}">
                            <i class="fa-solid fa-volume-high text-xs"></i>
                        </button>
                    </div>
                `;

                // Add grid item event listeners
                cardEl.querySelector('.grid-star-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleStar(card.id);
                });

                cardEl.querySelector('.grid-tts-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    speakKorean(card.exKr);
                });

                gridCards.appendChild(cardEl);
            });
        }

        // Shuffle Function
        function shuffleCards() {
            for (let i = filteredCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
            }
            currentIndex = 0;
            isFlipped = false;
            updateCardDisplay();
            renderGrid();
        }

        // Reset Filters
        function resetFilters() {
            searchInput.value = '';
            categoryFilter.value = 'ALL';
            statusFilter.value = 'ALL';
            filterCards();
        }

        // EVENT LISTENERS

        // Flashcard Click Flip
        flashcard.addEventListener('click', (e) => {
            // Prevent flip if clicking star or speech buttons
            if (e.target.closest('.star-btn') || e.target.closest('#btnTTSParticle') || e.target.closest('#btnTTSExample')) {
                return;
            }
            toggleFlip();
        });

        btnFlip.addEventListener('click', toggleFlip);

        // Navigation
        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCardDisplay();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentIndex < filteredCards.length - 1) {
                currentIndex++;
                updateCardDisplay();
            }
        });

        // TTS Buttons
        btnTTSParticle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (filteredCards[currentIndex]) {
                speakKorean(filteredCards[currentIndex].kr.replace('/', ' '));
            }
        });

        btnTTSExample.addEventListener('click', (e) => {
            e.stopPropagation();
            if (filteredCards[currentIndex]) {
                speakKorean(filteredCards[currentIndex].exKr);
            }
        });

        // Star Button inside Card
        document.querySelectorAll('#flashcard .star-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (filteredCards[currentIndex]) {
                    toggleStar(filteredCards[currentIndex].id);
                }
            });
        });

        // Search & Filters
        searchInput.addEventListener('input', filterCards);
        categoryFilter.addEventListener('change', filterCards);
        statusFilter.addEventListener('change', filterCards);
        btnShuffle.addEventListener('click', shuffleCards);
        btnResetFilters.addEventListener('click', resetFilters);

        // View Mode Toggle
        tabCardView.addEventListener('click', () => {
            currentMode = 'card';
            tabCardView.className = 'px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm bg-white text-blue-600 flex items-center gap-1.5';
            tabGridView.className = 'px-3 py-1.5 rounded-lg text-sm font-medium transition text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
            cardViewContainer.classList.remove('hidden');
            gridViewContainer.classList.add('hidden');
        });

        tabGridView.addEventListener('click', () => {
            currentMode = 'grid';
            tabGridView.className = 'px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm bg-white text-blue-600 flex items-center gap-1.5';
            tabCardView.className = 'px-3 py-1.5 rounded-lg text-sm font-medium transition text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
            gridViewContainer.classList.remove('hidden');
            cardViewContainer.classList.add('hidden');
            renderGrid();
        });

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (currentMode !== 'card' || document.activeElement === searchInput) return;

            if (e.key === 'ArrowLeft') {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateCardDisplay();
                }
            } else if (e.key === 'ArrowRight') {
                if (currentIndex < filteredCards.length - 1) {
                    currentIndex++;
                    updateCardDisplay();
                }
            } else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
                toggleFlip();
            }
        });

        // Swipe Gestures Support for Mobile
        let touchStartX = 0;
        let touchEndX = 0;

        flashcard.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        flashcard.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeDistance = touchEndX - touchStartX;
            if (Math.abs(swipeDistance) > 50) {
                if (swipeDistance < 0 && currentIndex < filteredCards.length - 1) {
                    // Swipe Left -> Next Card
                    currentIndex++;
                    updateCardDisplay();
                } else if (swipeDistance > 0 && currentIndex > 0) {
                    // Swipe Right -> Prev Card
                    currentIndex--;
                    updateCardDisplay();
                }
            }
        }

        // Initial Initialization
        updateProgress();
        updateCardDisplay();
    </script>
</body>
</html>
